      card.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          navigateWithDirection(href, "forward");
        }
      });
    });
  }

  function setupDirectionalLinks() {
    document.querySelectorAll("[data-nav-direction]").forEach((link) => {
      link.addEventListener("click", (e) => {
        const anchor = e.currentTarget;
        if (!(anchor instanceof HTMLAnchorElement)) return;
        const href = anchor.getAttribute("href");
        const direction = anchor.dataset.navDirection;
        if (!href || !direction) return;
        e.preventDefault();
        navigateWithDirection(href, direction);
      });
    });
  }

  function setupScrollGlow() {
    let rafId = null;
    const update = () => {
      const maxScroll = Math.max(document.documentElement.scrollHeight - window.innerHeight, 1);
      const progress = Math.min(window.scrollY / maxScroll, 1);
      document.body.style.setProperty("--scroll-glow", progress.toFixed(3));
      document.body.style.setProperty("--glow-strength", (0.2 + progress * 0.8).toFixed(3));
      rafId = null;
    };
    const requestUpdate = () => {
      if (rafId === null) rafId = requestAnimationFrame(update);
    };
    window.addEventListener("scroll", requestUpdate, { passive: true });
    window.addEventListener("resize", requestUpdate);
    update();
  }

  function setupHeaderEdgeLines() {
    const header = document.querySelector(".header");
    const navLinks = Array.from(document.querySelectorAll(".nav a"));
    const bagButton = document.querySelector(".bag-btn");
    if (!header || (!navLinks.length && !bagButton)) return;

    const navLine = document.createElement("div");
    navLine.className = "header-edge-line header-edge-line--nav";
    const bagLine = document.createElement("div");
    bagLine.className = "header-edge-line header-edge-line--bag";
    header.append(navLine, bagLine);

    let activeNav = null;
    let bagActive = false;

    function syncNavLine(target) {
      if (!target) return;
      const rect = target.getBoundingClientRect();
      const padX = 9;
      document.documentElement.style.setProperty("--header-nav-line-left", `${(rect.left - padX).toFixed(1)}px`);
      document.documentElement.style.setProperty("--header-nav-line-width", `${(rect.width + padX * 2).toFixed(1)}px`);
      document.documentElement.style.setProperty("--header-nav-line-height", `${(rect.bottom + 7).toFixed(1)}px`);
      document.documentElement.style.setProperty("--header-nav-line-scale", "1");
      navLine.classList.add("is-visible");
    }

    function hideNavLine() {
      activeNav = null;
      document.documentElement.style.setProperty("--header-nav-line-scale", "0");
      navLine.classList.remove("is-visible");
    }

    function syncBagLine() {
      if (!bagButton) return;
      const rect = bagButton.getBoundingClientRect();
      const padX = 9;
      document.documentElement.style.setProperty("--header-bag-line-top", `${(rect.top + rect.height / 2 - 21).toFixed(1)}px`);
      document.documentElement.style.setProperty("--header-bag-line-width", `${(window.innerWidth - rect.left + padX).toFixed(1)}px`);
      document.documentElement.style.setProperty("--header-bag-line-scale", "1");
      bagLine.classList.add("is-visible");
    }

    function hideBagLine() {
      bagActive = false;
      document.documentElement.style.setProperty("--header-bag-line-scale", "0");
      bagLine.classList.remove("is-visible");
    }

    navLinks.forEach((link) => {
      link.addEventListener("mouseenter", () => {
        activeNav = link;
        syncNavLine(link);
      });
      link.addEventListener("focus", () => {
        activeNav = link;
        syncNavLine(link);
      });
      link.addEventListener("mouseleave", hideNavLine);
      link.addEventListener("blur", hideNavLine);
    });

    if (bagButton) {
      bagButton.addEventListener("mouseenter", () => {
        bagActive = true;
        syncBagLine();
      });
      bagButton.addEventListener("focus", () => {
        bagActive = true;
        syncBagLine();
      });
      bagButton.addEventListener("mouseleave", hideBagLine);
      bagButton.addEventListener("blur", hideBagLine);
    }

    const resync = () => {
      if (activeNav) syncNavLine(activeNav);
      if (bagActive) syncBagLine();
    };
    window.addEventListener("resize", resync);
    window.addEventListener("scroll", resync, { passive: true });
  }

  function setupHeaderContrast() {
    const header = document.querySelector(".header");
    const themeSections = document.querySelectorAll("[data-header-theme='acid']");
    if (!header || !themeSections.length) return;

    const syncHeaderState = (isAcid) => {
      header.classList.toggle("header--hero", isAcid);
    };

    syncHeaderState(false);

    const sectionObserver = new IntersectionObserver((entries) => {
      const hasAcidSection = entries.some((entry) => entry.isIntersecting);
      syncHeaderState(hasAcidSection);
    }, {
      threshold: 0.2,
      rootMargin: "-64px 0px 0px 0px",
    });

    themeSections.forEach((section) => sectionObserver.observe(section));
  }

  function setupAboutTriangles() {
    const group = document.querySelector(".about__triangles");
    const scrollArea = group?.closest(".about__gallery-scroll");
    const track = group?.querySelector(".about__photo-track");
    if (!group || !scrollArea || !track) return;

    const baseTriangles = Array.from(track.querySelectorAll(".about__triangle"));
    if (!track.dataset.looped) {
      baseTriangles.forEach((triangle) => {
        const clone = triangle.cloneNode(true);
        clone.setAttribute("aria-hidden", "true");
        track.appendChild(clone);
      });
      track.dataset.looped = "true";
    }
    const triangles = Array.from(track.querySelectorAll(".about__triangle"));
    if (!triangles.length) return;

    const photos = [
      "assets/triangle-photo-1.png",
      "assets/triangle-photo-2.png",
      "assets/triangle-photo-3.png",
      "assets/triangle-photo-4.png",
      "assets/triangle-photo-1.png",
      "assets/triangle-photo-2.png",
      "assets/triangle-photo-3.png",
      "assets/triangle-photo-4.png",
      "assets/triangle-photo-1.png",
      "assets/triangle-photo-2.png",
    ];
    const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    triangles.forEach((triangle, index) => {
      triangle.dataset.photoIndex = String(index % photos.length);
      triangle.style.setProperty("--triangle-index", index);
      triangle.style.setProperty("--triangle-photo", `url("${photos[index % photos.length]}")`);
    });

    if (prefersReduced) return;

    let rafId = null;
    let isActive = false;
    let currentOffset = 0;
    let targetOffset = 0;
    let loopWidth = 1;

    function measureLoopWidth() {
      const firstTriangle = triangles[0];
      const firstClone = track.querySelector('.about__triangle[aria-hidden="true"]');
      loopWidth = firstClone && firstTriangle
        ? Math.max(1, firstClone.offsetLeft - firstTriangle.offsetLeft)
        : Math.max(1, track.scrollWidth / 2);
    }

    function updateTargetFromScroll() {
      measureLoopWidth();
      const sectionTop = scrollArea.getBoundingClientRect().top + window.scrollY;
      const rawProgress = (window.scrollY - sectionTop + window.innerHeight) / window.innerHeight;
      const progress = Math.max(0, Math.min(1, rawProgress));
      const eased = progress < 0.5
        ? 4 * progress * progress * progress
        : 1 - Math.pow(-2 * progress + 2, 3) / 2;
      targetOffset = Math.max(targetOffset, eased * loopWidth * 0.32);
    }

    function renderParallax() {
      rafId = null;
      currentOffset += (targetOffset - currentOffset) * 0.075;
      const wrappedOffset = loopWidth ? currentOffset % loopWidth : currentOffset;
      track.style.setProperty("--gallery-x", `${(-wrappedOffset).toFixed(1)}px`);

      triangles.forEach((triangle) => {
        const tRect = triangle.getBoundingClientRect();
        const centerProgress = ((tRect.left + tRect.width / 2) / window.innerWidth) - 0.5;
        const parallax = Math.max(-10, Math.min(10, centerProgress * -14));
        triangle.style.setProperty("--photo-parallax", `${parallax.toFixed(2)}%`);
        if (isActive) {
          triangle.style.opacity = "1";
          triangle.style.transform = "translate3d(0, 0, 0)";
        }
      });

      if (isActive && Math.abs(targetOffset - currentOffset) > 0.18) {
        rafId = requestAnimationFrame(renderParallax);
      }
    }

    function requestParallax() {
      if (rafId === null) rafId = requestAnimationFrame(renderParallax);
    }

    function handleGalleryScroll() {
      if (!isActive) return;
      updateTargetFromScroll();
      requestParallax();
    }

    function isGalleryVisible() {
      const rect = scrollArea.getBoundingClientRect();
      return rect.top < window.innerHeight && rect.bottom > 0;
    }

    function handleGalleryWheel(event) {
      if (!isActive || !isGalleryVisible()) return;
      const delta = Math.abs(event.deltaX) > Math.abs(event.deltaY) ? event.deltaX : event.deltaY;
      if (delta <= 0) return;

      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      const atPageBottom = window.scrollY >= maxScroll - 2;
      if (!atPageBottom) return;

      event.preventDefault();
      targetOffset += delta * 0.42;
      requestParallax();
    }

    let hasStarted = false;
    const start = () => {
      if (hasStarted) return;
      hasStarted = true;
      isActive = true;
      triangles.forEach((triangle, index) => {
        triangle.style.animationDelay = `${(0.22 + index * 0.055).toFixed(3)}s`;
      });
      measureLoopWidth();
      updateTargetFromScroll();
      window.addEventListener("scroll", handleGalleryScroll, { passive: true });
      window.addEventListener("wheel", handleGalleryWheel, { passive: false });
      window.addEventListener("resize", () => {
        measureLoopWidth();
        updateTargetFromScroll();
        requestParallax();
      });
      requestParallax();
    };

    const triangleObserver = new IntersectionObserver((entries) => {
      if (entries.some((entry) => entry.isIntersecting)) {
        start();
        triangleObserver.disconnect();
      }
    }, { threshold: 0.32 });

    triangleObserver.observe(group);
  }

  /* ---------- Reveal on scroll ---------- */
  let observer;
  function observeReveals() {
    if (observer) observer.disconnect();
    observer = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add("in");
          observer.unobserve(e.target);
        }
      });
    }, { threshold: 0.1, rootMargin: "0px 0px -10% 0px" });
    document.querySelectorAll(".reveal, .about__eyebrow").forEach(el => observer.observe(el));
  }

  /* ---------- Init ---------- */
  async function initPage() {
    setupHeroScrollIntro();
    setupHeroReplies();
    setupAboutTriangles();

    const initialCategory = sessionStorage.getItem(FILTER_KEY) || "all";
    const initialButton = document.querySelector(`.filter button[data-cat="${initialCategory}"]`);
    if (initialButton) {
      filterButtons.forEach(b => b.classList.remove("active"));
      initialButton.classList.add("active");
    }

    await loadProducts();
    render(initialCategory);
    updateBagCount();
    renderBag();
    setupHeaderContrast();
    setupHeaderEdgeLines();
    setupDirectionalLinks();
    setupScrollGlow();
    setupFilterHoverLine();

    bagButton.addEventListener("click", openBag);
  bagClose.addEventListener("click", closeBag);
  bagOverlay.addEventListener("click", closeBag);
  bagCheckout.addEventListener("click", (e) => {
    e.preventDefault();
    checkoutCart();
  });
    document.addEventListener("click", (e) => {
      const target = e.target.closest(".bag-btn");
      if (!target) return;
      openBag();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeBag();
    });
    bagItems.addEventListener("click", (e) => {
    const removeIndex = e.target.closest("[data-remove]")?.dataset.remove;
    if (removeIndex !== undefined) {
      const cart = loadCart();
      cart.splice(Number(removeIndex), 1);
      saveCart(cart);
      updateBagCount();
      renderBag();
      return;
    }

    const qtyControl = e.target.closest(".bag-item__qty");
    const action = e.target.dataset.action;
    if (qtyControl && action) {
      updateQuantity(Number(qtyControl.dataset.index), action === "increase" ? 1 : -1);
    }
    });
  }

  initPage();

  /* ---------- About: マウス追従するCTAボタン ---------- */
  (function setupAboutCta() {
    const section = document.querySelector(".about");
    const cta = document.querySelector(".about__cta");
    if (!section || !cta) return;

    let targetX = 0;
    let targetY = 0;
    let currentX = 0;
    let currentY = 0;
    let centerX = 0;
    let centerY = 0;
    let isHovering = false;
    let rafId = null;

    function calcCenter() {
      const sRect = section.getBoundingClientRect();
      // セクション内座標での中央
      centerX = sRect.width / 2;
      centerY = sRect.height / 2;
      if (!isHovering) {
        targetX = centerX;
        targetY = centerY;
        currentX = centerX;
        currentY = centerY;
        applyPos();
      }
    }

    function applyPos() {
      cta.style.setProperty("--cta-x", currentX + "px");
      cta.style.setProperty("--cta-y", currentY + "px");
    }

    function tick() {
      const ease = isHovering ? 0.18 : 0.08;
      currentX += (targetX - currentX) * ease;
      currentY += (targetY - currentY) * ease;
      applyPos();

      const dx = Math.abs(targetX - currentX);
      const dy = Math.abs(targetY - currentY);
      if (dx < 0.1 && dy < 0.1) {
        currentX = targetX;
        currentY = targetY;
        applyPos();
        rafId = null;
        return;
      }
      rafId = requestAnimationFrame(tick);
    }

    function startTick() {
      if (rafId === null) rafId = requestAnimationFrame(tick);
    }

    section.addEventListener("mousemove", (e) => {
      isHovering = true;
      const rect = section.getBoundingClientRect();
      // ボタン中心 = マウス位置（セクション基準座標）
      targetX = e.clientX - rect.left;
      targetY = e.clientY - rect.top;
      startTick();
    });

    section.addEventListener("mouseleave", () => {
      isHovering = false;
      targetX = centerX;
      targetY = centerY;
      startTick();
    });

    window.addEventListener("resize", calcCenter);
    requestAnimationFrame(() => {
      calcCenter();
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(calcCenter);
      }
    });
  })();
</script>
