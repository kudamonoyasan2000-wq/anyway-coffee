    if (bagBody) bagBody.scrollTop = 0;
  }

  function openBag() {
    renderBag();
    const bagBody = bagItems.closest(".bag-drawer__body");
    bagDrawer.scrollTop = 0;
    if (bagBody) bagBody.scrollTop = 0;
    bagDrawer.classList.add("is-open");
    bagOverlay.classList.add("is-open");
    bagDrawer.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    requestAnimationFrame(() => {
      bagDrawer.scrollTop = 0;
      if (bagBody) bagBody.scrollTop = 0;
      requestAnimationFrame(() => {
        bagDrawer.scrollTop = 0;
        if (bagBody) bagBody.scrollTop = 0;
      });
    });
    window.setTimeout(() => {
      bagDrawer.scrollTop = 0;
      if (bagBody) bagBody.scrollTop = 0;
    }, 80);
  }

  function closeBag() {
    bagDrawer.classList.remove("is-open");
    bagOverlay.classList.remove("is-open");
    bagDrawer.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
  }

  async function checkoutCart() {
    const cart = loadCart();
    if (!cart.length) return;

    const originalLabel = bagCheckout.textContent;
    bagCheckout.textContent = "Preparing checkout...";
    bagCheckout.style.pointerEvents = "none";

    try {
      const res = await fetch("/api/checkout/session", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          items: cart.map((item) => ({
            id: item.id,
            size: item.size,
            grind: item.grind,
            quantity: item.quantity,
          })),
        }),
      });

      const data = await res.json();
      if (!res.ok || !data.url) {
        throw new Error(data.message || "Failed to start checkout");
      }

      window.location.href = data.url;
    } catch (error) {
      console.error(error);
      window.alert(`Checkout could not start.\n${error.message}`);
      bagCheckout.textContent = originalLabel;
      bagCheckout.style.pointerEvents = "";
    }
  }

  function updateQuantity(index, delta) {
    const cart = loadCart();
    const item = cart[index];
    if (!item) return;
    item.quantity += delta;
    if (item.quantity <= 0) {
      cart.splice(index, 1);
    }
    saveCart(cart);
    updateBagCount();
    renderBag();
  }

  let productsData = [...FALLBACK_PRODUCTS];

  async function loadProducts() {
    try {
      const res = await fetch("/api/products");
      if (!res.ok) throw new Error(`Failed to load products: ${res.status}`);
      const data = await res.json();
      if (Array.isArray(data.contents) && data.contents.length) {
        productsData = data.contents;
      }
    } catch (error) {
      console.warn("Using fallback products.", error);
      productsData = [...FALLBACK_PRODUCTS];
    }
    applyHeroBackground(productsData);
  }

  function getProductHref(product) {
    const target = product.href || "product.html";
    const separator = target.includes("?") ? "&" : "?";
    return `${target}${separator}id=${encodeURIComponent(product.id)}`;
  }

  function render(category) {
    const list = category === "all" ? productsData : productsData.filter(p => p.category === category);
    if (shopIntroText) {
      shopIntroText.textContent = FILTER_COPY[category] || FILTER_COPY.all;
      shopIntroText.style.display = category === "all" ? "none" : "";
    }
    grid.innerHTML = list.map((p, index) => {
      const italicHTML = p.italic ? `<em>${p.italic}</em>` : "";
      const sizeClass = `size-${p.size || "m"}`;
      const offsetClass = p.offset ? `offset-${p.offset}` : "";
      const hoverLabel = p.hoverLabel || "ADD TO CART";
      const hoverImageClass = p.hoverImage ? "has-hover-image" : "";
      const imageClass = p.image ? "has-image" : "";
      return `
        <article class="card reveal ${sizeClass} ${offsetClass} ${hoverImageClass} ${imageClass}" role="link" tabindex="0" aria-label="${p.name}の商品詳細を見る" data-href="${getProductHref(p)}" data-cat="${p.category}" style="--ph: ${p.color}; --img: ${p.image ? `url('${p.image}')` : "none"}; --img-hover: ${p.hoverImage ? `url('${p.hoverImage}')` : "none"}; --reveal-index: ${index};">
          <div class="card__media" aria-hidden="true">
            <div class="card__art"></div>
            <div class="card__image"></div>
            <div class="card__image-hover"></div>
            <div class="card__cursor"><span class="label">${hoverLabel}</span><span class="brace">}</span></div>
          </div>
          <div class="card__info">
            <div>
              <div class="card__name"><span class="card__name-main">${p.name}</span>${italicHTML}</div>
            </div>
            <div class="card__price">${yen.format(p.price)}</div>
          </div>
        </article>
      `;
    }).join("");
    observeReveals();
    setupCardCursors();
    setupCardLinks();
  }

  function navigateWithDirection(href, direction) {
    sessionStorage.setItem("hysd-nav-direction", direction);
    window.location.href = href;
  }

  /* ---------- Filter ---------- */
  filterButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      filterButtons.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      sessionStorage.setItem(FILTER_KEY, btn.dataset.cat);
      syncFilterActiveLine(btn);
      render(btn.dataset.cat);
    });
  });

  function syncFilterActiveLine(activeButton = document.querySelector(".filter button.active")) {
    const filter = document.querySelector(".filter");
    if (!filter) return;
    const category = activeButton?.dataset.cat || "all";
    filter.classList.toggle("has-category-active", category !== "all");
    if (category === "coffee" || category === "goods") {
      syncFilterLine(activeButton);
    } else {
      filter.classList.remove("is-line-showing");
      filter.style.setProperty("--filter-hover-width", "0px");
    }
  }

  function syncFilterLine(button) {
    const filter = document.querySelector(".filter");
    if (!filter || !button) return;
    const filterRect = filter.getBoundingClientRect();
    const buttonRect = button.getBoundingClientRect();
    const width = Math.max(0, buttonRect.right - filterRect.left);
    filter.style.setProperty("--filter-hover-width", `${width.toFixed(1)}px`);
    filter.classList.add("is-line-showing");
  }

  function setupFilterHoverLine() {
    const filter = document.querySelector(".filter");
    if (!filter) return;
    const hoverTargets = filter.querySelectorAll('button[data-cat="coffee"], button[data-cat="goods"]');
    const activeButton = () => filter.querySelector("button.active");
    const hideLine = () => {
      syncFilterActiveLine(activeButton());
    };

    hoverTargets.forEach((button) => {
      button.addEventListener("mouseenter", () => syncFilterLine(button));
      button.addEventListener("mousemove", () => syncFilterLine(button));
      button.addEventListener("focus", () => syncFilterLine(button));
      button.addEventListener("blur", hideLine);
    });
    filter.addEventListener("mouseleave", hideLine);
    window.addEventListener("resize", hideLine);
    syncFilterActiveLine(activeButton());
  }

  document.querySelectorAll(".footer__chip[data-footer-filter]").forEach((link) => {
    link.addEventListener("click", (event) => {
      event.preventDefault();
      const cat = link.dataset.footerFilter;
      const matchingButton = document.querySelector(`.filter button[data-cat="${cat}"]`);
      if (matchingButton) matchingButton.click();
      document.getElementById("shop")?.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  });

  /* ---------- Card cursor: マウス追従の "View more" ---------- */
  function setupCardCursors() {
    let hoverLine = document.querySelector(".card-hover-line");
    if (!hoverLine) {
      hoverLine = document.createElement("div");
      hoverLine.className = "card-hover-line";
      hoverLine.setAttribute("aria-hidden", "true");
      document.body.appendChild(hoverLine);
    }
    let hoverLabel = document.querySelector(".card-hover-label");
    if (!hoverLabel) {
      hoverLabel = document.createElement("div");
      hoverLabel.className = "card-hover-label";
      hoverLabel.setAttribute("aria-hidden", "true");
      document.body.appendChild(hoverLabel);
    }

    let lineTargetX = 0;
    let lineTargetY = -100;
    let lineCurrentX = 0;
    let lineCurrentY = -100;
    let lineActive = false;
    let lineRafId = null;

    function applyHoverLine() {
      hoverLine.style.setProperty("--hover-line-x", `${Math.max(0, lineCurrentX).toFixed(1)}px`);
      hoverLine.style.setProperty("--hover-line-y", `${lineCurrentY.toFixed(1)}px`);
      hoverLine.style.setProperty("--hover-line-opacity", lineActive ? "1" : "0");
      hoverLine.style.setProperty("--hover-line-scale", lineActive ? "1" : "0");
      hoverLabel.style.setProperty("--hover-label-x", `${Math.max(0, lineCurrentX).toFixed(1)}px`);
      hoverLabel.style.setProperty("--hover-label-y", `${lineCurrentY.toFixed(1)}px`);
      hoverLabel.style.setProperty("--hover-label-opacity", lineActive ? "1" : "0");
    }

    function tickHoverLine() {
      const ease = lineActive ? 0.2 : 0.24;
      lineCurrentX += (lineTargetX - lineCurrentX) * ease;
      lineCurrentY += (lineTargetY - lineCurrentY) * 0.32;
      applyHoverLine();

      if (
        Math.abs(lineTargetX - lineCurrentX) < 0.4 &&
        Math.abs(lineTargetY - lineCurrentY) < 0.4
      ) {
        lineRafId = null;
        return;
      }
      lineRafId = requestAnimationFrame(tickHoverLine);
    }

    function startHoverLineTick() {
      if (lineRafId === null) lineRafId = requestAnimationFrame(tickHoverLine);
    }

    function moveHoverLine(event, cursorEl, mediaEl, isEntering = false) {
      hoverLabel.innerHTML = cursorEl.innerHTML;
      const mediaRect = mediaEl.getBoundingClientRect();
      const cursorWidth = hoverLabel.offsetWidth || cursorEl?.offsetWidth || 0;
      const cursorHeight = hoverLabel.offsetHeight || cursorEl?.offsetHeight || 0;
      const localX = event.clientX - mediaRect.left;
      const localY = event.clientY - mediaRect.top;
      const safeX = cursorWidth >= mediaEl.clientWidth
        ? mediaEl.clientWidth / 2
        : Math.min(Math.max(localX, cursorWidth / 2), mediaEl.clientWidth - cursorWidth / 2);
      const safeY = cursorHeight >= mediaEl.clientHeight
        ? mediaEl.clientHeight / 2
        : Math.min(Math.max(localY, cursorHeight / 2), mediaEl.clientHeight - cursorHeight / 2);
      const nextX = Math.max(0, mediaRect.left + safeX + cursorWidth / 2);
      lineTargetX = nextX;
      lineTargetY = mediaRect.top + safeY;
      if (!lineActive || isEntering) {
        lineCurrentX = Math.min(lineCurrentX, nextX * 0.18);
        lineCurrentY = lineTargetY;
      }
      lineActive = true;
      startHoverLineTick();
    }

    function hideHoverLine() {
      lineActive = false;
      lineTargetX = 0;
      startHoverLineTick();
    }

    document.querySelectorAll(".card").forEach((card) => {
      if (card.dataset.cursorReady === "1") return;
      card.dataset.cursorReady = "1";
      const cursor = card.querySelector(".card__cursor");
      const media = card.querySelector(".card__media");
      if (!cursor || !media) return;

      let targetX = 0, targetY = 0;
      let currentX = 0, currentY = 0;
      let isHovering = false;
      let rafId = null;

      function applyPos() {
        const cursorWidth = cursor.offsetWidth || 0;
        const cursorHeight = cursor.offsetHeight || 0;
        const safeX = cursorWidth >= media.clientWidth
          ? media.clientWidth / 2
          : Math.min(Math.max(currentX, cursorWidth / 2), media.clientWidth - cursorWidth / 2);
        const safeY = cursorHeight >= media.clientHeight
          ? media.clientHeight / 2
          : Math.min(Math.max(currentY, cursorHeight / 2), media.clientHeight - cursorHeight / 2);
        cursor.style.setProperty("--cur-x", `calc(${safeX}px - 50%)`);
        cursor.style.setProperty("--cur-y", `calc(${safeY}px - 50%)`);
      }

      function tick() {
        const ease = 0.28;
        currentX += (targetX - currentX) * ease;
        currentY += (targetY - currentY) * ease;
        applyPos();

        if (Math.abs(targetX - currentX) < 0.1 && Math.abs(targetY - currentY) < 0.1) {
          rafId = null;
          return;
        }
        rafId = requestAnimationFrame(tick);
      }

      function startTick() {
        if (rafId === null) rafId = requestAnimationFrame(tick);
      }

      media.addEventListener("mouseenter", (e) => {
        isHovering = true;
        card.classList.add("is-hovered");
        moveHoverLine(e, cursor, media, true);
        const rect = media.getBoundingClientRect();
        targetX = e.clientX - rect.left;
        targetY = e.clientY - rect.top;
        // 初期位置を即時セット（カーソルがジャンプしないように）
        currentX = targetX;
        currentY = targetY;
        applyPos();
        startTick();
      });

      media.addEventListener("mousemove", (e) => {
        if (!isHovering) {
          isHovering = true;
          card.classList.add("is-hovered");
        }
        moveHoverLine(e, cursor, media);
        const rect = media.getBoundingClientRect();
        targetX = e.clientX - rect.left;
        targetY = e.clientY - rect.top;
        startTick();
      });

      media.addEventListener("mouseleave", () => {
        isHovering = false;
        card.classList.remove("is-hovered");
        hideHoverLine();
      });
    });
  }

  function setupCardLinks() {
    document.querySelectorAll(".card").forEach((card) => {
      const href = card.dataset.href;
      if (!href) return;
      card.addEventListener("click", () => {
        navigateWithDirection(href, "forward");
      });
      card.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          navigateWithDirection(href, "forward");
        }
      });
    });
  }

  function setupDirectionalLinks() {
    document.querySelectorAll("[data-nav-direction]").forEach((link) => {
      link.addEventListener("click", (e) => {
        const anchor = e.currentTarget;
        if (!(anchor instanceof HTMLAnchorElement)) return;
        const href = anchor.getAttribute("href");
        const direction = anchor.dataset.navDirection;
        if (!href || !direction) return;
        e.preventDefault();
        navigateWithDirection(href, direction);
      });
    });
  }

  function setupScrollGlow() {
    let rafId = null;
    const update = () => {
      const maxScroll = Math.max(document.documentElement.scrollHeight - window.innerHeight, 1);
      const progress = Math.min(window.scrollY / maxScroll, 1);
      document.body.style.setProperty("--scroll-glow", progress.toFixed(3));
      document.body.style.setProperty("--glow-strength", (0.2 + progress * 0.8).toFixed(3));
      rafId = null;
    };
    const requestUpdate = () => {
      if (rafId === null) rafId = requestAnimationFrame(update);
    };
    window.addEventListener("scroll", requestUpdate, { passive: true });
    window.addEventListener("resize", requestUpdate);
    update();
  }

  function setupHeaderContrast() {
    const header = document.querySelector(".header");
    const themeSections = document.querySelectorAll("[data-header-theme='acid']");
    if (!header || !themeSections.length) return;

    const syncHeaderState = (isAcid) => {
      header.classList.toggle("header--hero", isAcid);
    };

    syncHeaderState(false);

    const sectionObserver = new IntersectionObserver((entries) => {
      const hasAcidSection = entries.some((entry) => entry.isIntersecting);
      syncHeaderState(hasAcidSection);
    }, {
      threshold: 0.2,
      rootMargin: "-64px 0px 0px 0px",
    });

    themeSections.forEach((section) => sectionObserver.observe(section));
  }

  function setupAboutTriangles() {
    const group = document.querySelector(".about__triangles");
    const triangles = Array.from(document.querySelectorAll(".about__triangle"));
    if (!group || !triangles.length) return;

    const photos = [
      "assets/triangle-photo-1.png",
      "assets/triangle-photo-2.png",
      "assets/triangle-photo-3.png",
      "assets/triangle-photo-4.png",
    ];
    const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const setPhoto = (triangle, offset = 0) => {
      const current = Number(triangle.dataset.photoIndex || 0);
      const next = (current + 1 + offset) % photos.length;
      triangle.dataset.photoIndex = String(next);
      triangle.style.setProperty("--triangle-photo", `url("${photos[next]}")`);
      triangle.classList.add("is-flipping");
      window.setTimeout(() => triangle.classList.remove("is-flipping"), 110);
    };

    triangles.forEach((triangle, index) => {
      triangle.dataset.photoIndex = String(index % photos.length);
      triangle.style.setProperty("--triangle-photo", `url("${photos[index % photos.length]}")`);
    });

    if (prefersReduced) return;

    let hasStarted = false;
    const start = () => {
      if (hasStarted) return;
      hasStarted = true;

      triangles.forEach((triangle, index) => {
        let flips = 0;
        const burst = window.setInterval(() => {
          setPhoto(triangle, index + flips);
          flips += 1;
          if (flips > 9 + index) window.clearInterval(burst);
        }, 92 + index * 13);

        window.setInterval(() => {
          setPhoto(triangle, index + Math.floor(Math.random() * photos.length));
        }, 1800 + index * 290);
      });
    };

    const triangleObserver = new IntersectionObserver((entries) => {
      if (entries.some((entry) => entry.isIntersecting)) {
        start();
        triangleObserver.disconnect();
      }
    }, { threshold: 0.32 });

    triangleObserver.observe(group);
  }

  /* ---------- Reveal on scroll ---------- */
  let observer;
  function observeReveals() {
    if (observer) observer.disconnect();
    observer = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add("in");
          observer.unobserve(e.target);
        }
      });
    }, { threshold: 0.1, rootMargin: "0px 0px -10% 0px" });
    document.querySelectorAll(".reveal, .about__eyebrow").forEach(el => observer.observe(el));
  }

  /* ---------- Init ---------- */
  async function initPage() {
    setupHeroEmotionIntro();
    setupHeroScrollIntro();
    setupHeroReplies();
    setupAboutTriangles();

    const initialCategory = sessionStorage.getItem(FILTER_KEY) || "all";
    const initialButton = document.querySelector(`.filter button[data-cat="${initialCategory}"]`);
    if (initialButton) {
      filterButtons.forEach(b => b.classList.remove("active"));
      initialButton.classList.add("active");
    }

    await loadProducts();
    render(initialCategory);
    updateBagCount();
    renderBag();
    setupHeaderContrast();
    setupDirectionalLinks();
    setupScrollGlow();
    setupFilterHoverLine();

    bagButton.addEventListener("click", openBag);
  bagClose.addEventListener("click", closeBag);
  bagOverlay.addEventListener("click", closeBag);
  bagCheckout.addEventListener("click", (e) => {
    e.preventDefault();
    checkoutCart();
  });
    document.addEventListener("click", (e) => {
      const target = e.target.closest(".bag-btn");
      if (!target) return;
      openBag();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeBag();
    });
    bagItems.addEventListener("click", (e) => {
    const removeIndex = e.target.closest("[data-remove]")?.dataset.remove;
    if (removeIndex !== undefined) {
      const cart = loadCart();
      cart.splice(Number(removeIndex), 1);
      saveCart(cart);
      updateBagCount();
      renderBag();
      return;
    }

    const qtyControl = e.target.closest(".bag-item__qty");
    const action = e.target.dataset.action;
    if (qtyControl && action) {
      updateQuantity(Number(qtyControl.dataset.index), action === "increase" ? 1 : -1);
    }
    });
  }

  initPage();

  /* ---------- About: マウス追従するCTAボタン ---------- */
  (function setupAboutCta() {
    const section = document.querySelector(".about");
    const cta = document.querySelector(".about__cta");
    if (!section || !cta) return;

    let targetX = 0;
    let targetY = 0;
    let currentX = 0;
    let currentY = 0;
    let centerX = 0;
    let centerY = 0;
    let isHovering = false;
    let rafId = null;

    function calcCenter() {
      const sRect = section.getBoundingClientRect();
      // セクション内座標での中央
      centerX = sRect.width / 2;
      centerY = sRect.height / 2;
      if (!isHovering) {
        targetX = centerX;
        targetY = centerY;
        currentX = centerX;
        currentY = centerY;
        applyPos();
      }
    }

    function applyPos() {
      cta.style.setProperty("--cta-x", currentX + "px");
      cta.style.setProperty("--cta-y", currentY + "px");
    }

    function tick() {
      const ease = isHovering ? 0.18 : 0.08;
      currentX += (targetX - currentX) * ease;
      currentY += (targetY - currentY) * ease;
      applyPos();

      const dx = Math.abs(targetX - currentX);
      const dy = Math.abs(targetY - currentY);
      if (dx < 0.1 && dy < 0.1) {
        currentX = targetX;
        currentY = targetY;
        applyPos();
        rafId = null;
        return;
      }
      rafId = requestAnimationFrame(tick);
    }

    function startTick() {
      if (rafId === null) rafId = requestAnimationFrame(tick);
    }

    section.addEventListener("mousemove", (e) => {
      isHovering = true;
      const rect = section.getBoundingClientRect();
      // ボタン中心 = マウス位置（セクション基準座標）
      targetX = e.clientX - rect.left;
      targetY = e.clientY - rect.top;
      startTick();
    });

    section.addEventListener("mouseleave", () => {
      isHovering = false;
      targetX = centerX;
      targetY = centerY;
      startTick();
    });

    window.addEventListener("resize", calcCenter);
    requestAnimationFrame(() => {
      calcCenter();
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(calcCenter);
      }
    });
  })();
</script>
